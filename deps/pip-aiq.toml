[[dependency]]
# uvloop does not support Windows. Keep the Linux runtime optimization without
# making the shared NAT prebundle fail during Windows builds.
python = "../_build/target-deps/python"
packages = ["uvloop==0.22.1"]
extra_args = ["--no-deps", "--no-cache-dir", "--force-reinstall", "--upgrade", "--ignore-installed", "--use-deprecated=legacy-resolver"]
target = "../_build/target-deps/pip_nat_prebundle"
platforms = ["linux-x86_64", "linux-aarch64"]
download_only = false
append_to_install_folder = true
gather_licenses_path = "../_build/PACKAGE-LICENSES/PIP-prebundled-LICENSES.txt"
