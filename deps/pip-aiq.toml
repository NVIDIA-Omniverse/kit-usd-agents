    # evaluation core no longer depends on RAGAS, so the runtime remains free
    # of the unfixed CVE-2026-6587 package while satisfying langchain 1.4.x.
    "nvidia-nat==1.8.0a20260514",
    "nvidia-nat-core==1.8.0a20260514",
    "nvidia-nat-atif==1.8.0a20260514",
