[[dependency]]
# This file is used to install the pip dependencies for the core extension.
# Cache-bust marker: 2026-09-29 Isaac Sim 6.2 RC.1 security floors for
# transitive prebundle packages (internal issues 6830604, 6830392, 6830382). Changing
# this file's hash forces packman to re-install the local source/modules/*
# packages even though pip-core.toml itself pins no versions on them.
python = "../_build/target-deps/python"
packages = [
    # Local packages - use ./ prefix to ensure pip uses local source, not external registry
    "./source/modules/lc_agent",
    "./source/modules/rags/rag_modifiers",
    "./source/modules/rags/rag_nodes",
    "./source/modules/rags/retrievers",
    "./source/modules/agents/usd",
    "./source/modules/agents/interactive",
    "./source/modules/data_generation/usdcode",

    # External dependencies
    "blobfile",
    "faiss-cpu==1.12.0",
    "fastapi==0.136.1",
    "jsonschema",
    "langchain>=1.3.17",
    "langchain-core>=1.4.7,<2.0.0",
    "langchain-nvidia-ai-endpoints>=1.4.3,<2.0.0",
    "langchain-community>=0.3.27",
    "langchain-openai",
    # LiteLLM 1.99 (required by NVIDIA NAT 1.8) supports OpenAI SDK 2.x.
    "openai>=2.45.0,<3.0.0",
    "numpy",
    "starlette>=1.6.0,<2.0.0",
    "urllib3>=2.7.0",
    # Transitive packages flagged in Isaac Sim 6.2 RC.1 scans; floors keep a
    # stale resolver cache from shipping the vulnerable versions again.
    "anyio>=4.14.2",  # CVE-2026-63374, CVE-2026-63349
    "langchain-classic>=1.0.7",  # GHSA-3644-q5cj-c5c7
    "langgraph-sdk>=0.3.15",  # CVE-2026-48776
    "langsmith>=0.8.18",  # GHSA-3644-q5cj-c5c7, GHSA-f4xh-w4cj-qxq8
    "uvicorn",
    "lxml>=6.1.3",  # libxslt BDSAs; Windows libxml2 2.11.9 finding
    "tiktoken",
]
extra_args = ["--no-cache-dir", "--force-reinstall", "--upgrade", "--ignore-installed"]
target = "../_build/target-deps/pip_core_prebundle"
platforms = ["*"]
download_only = false
append_to_install_folder = true
gather_licenses_path = "../_build/PACKAGE-LICENSES/PIP-prebundled-LICENSES.txt"
