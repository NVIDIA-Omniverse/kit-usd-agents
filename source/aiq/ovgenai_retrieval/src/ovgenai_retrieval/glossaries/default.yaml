# Default query-expansion glossary for Omniverse agent tools.
#
# Satisfies OmniverseKitMCPsImprove-SRD REQ-QE-1 (§3.3.1): 9-domain glossary
# with ~200 abbreviation→expansion entries that fire in ``expand_query()``.
#
# Format: top-level keys are domain names (documentation only — not used
# for routing at runtime); inner mapping is ``{abbreviation: [expansion_terms]}``.
# Lookup is case-insensitive on the key. Expansion terms are appended to the
# query in parentheses by ``query_expansion.expand`` when the abbreviation is
# a whole-word match in the user query.
#
# Rules:
# - Abbreviation keys are the exact form users type (usually uppercase or
#   CamelCase). Lookup is case-insensitive, so both "Gf" and "GF" match.
# - Expansion lists: first entry is the primary canonical term; the rest
#   are synonyms / alternate phrasings the retriever should also see.
# - Never include the abbreviation itself in its own expansion list.
# - Avoid entries whose "abbreviation" is a common English word (e.g. "RGB"
#   is fine because it's not a word; "CAM" is risky because "cam" appears
#   in camera-related prose). When in doubt, err toward inclusion — the
#   ``skip_redundant`` logic in expand() already avoids double-appending
#   when the expansion terms are already in the query.

