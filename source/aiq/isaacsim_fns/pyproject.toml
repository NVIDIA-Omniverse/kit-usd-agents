[tool.poetry]
name = "isaacsim-fns"
version = "2.2.2"
description = "Isaac Sim functions for NVIDIA Omniverse Isaac Sim development - providing Isaac Sim extension information, APIs, code examples, and application templates (NAT-compatible)"
authors = ["NVIDIA Omniverse"]
readme = "README.md"
homepage = "https://github.com/NVIDIA-Omniverse/kit-usd-agents"
repository = "https://github.com/NVIDIA-Omniverse/kit-usd-agents"
documentation = "https://github.com/NVIDIA-Omniverse/kit-usd-agents"
keywords = ["omniverse", "ai", "tools", "code-generation", "aiq", "functions", "isaac", "sim"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
packages = [{include = "isaacsim_fns", from = "src"}]
include = [
    "src/isaacsim_fns/data/**/*",
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
# Keep the NAT packages on the matched release already validated by the MCP
# smoke suite. Its runtime graph does not include the optional RAGAS evaluator.
nvidia-nat = "1.8.0a20260514"
nvidia-nat-langchain = "1.8.0a20260514"
# LangChain dependencies
langchain = ">=1.3.9"             # GHSA-gr75-jv2w-4656 path traversal/sandbox escape
langchain-community = ">=0.3.31"
langchain-core = ">=1.4.7,<2"     # CVE-2026-44843 fixed in 1.3.3; 1.4.x required by langchain>=1.3.9
langchain-openai = ">=1.1.14"     # BDSA-2026-7431 SSRF in chat_models/base.py urltosize()
langsmith = ">=0.7.31"            # BDSA-2026-9844 + 6 Medium BDSAs (streaming token redaction bypass)
langchain-nvidia-ai-endpoints = ">=1.4.3,<2"
# Vector search and HTTP dependencies
faiss-cpu = ">=1.7.0"
requests = ">=2.25.0"
httpx = ">=0.24.0"
# Configuration support
pyyaml = ">=6.0"
# Telemetry support
redis = {extras = ["hiredis"], version = ">=4.5.0"}
# Transitive dependencies
grpcio = ">=1.76.0"
# Pin yarl<1.24: yarl 1.24.0 (released 2026-05) only ships wheels for
# newer Python+glibc combinations than the CI runner's python:3.11-slim
# base. Drop once CI base moves forward.
yarl = "<1.24"
# Security floors for dependencies pulled in by NVIDIA NAT.
cryptography = ">=50.0.0,<51"
litellm = ">=1.84.0,<2"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10.0.0"
pytest-cov = "^4.0.0"
pytest-asyncio = "^0.21.0"
black = ">=26.3.1,<27.0.0"
flake8 = "^6.0.0"
mypy = "^1.0.0"

# Entry points for Isaac Sim functions - Dual registration for AIQ and NAT compatibility
# AIQ entry points (backwards compatibility)
[tool.poetry.plugins."aiq.components"]
isaacsim_fns_get_isaac_sim_instructions = "isaacsim_fns.register_get_isaac_sim_instructions"
isaacsim_fns_search_isaac_sim_extensions = "isaacsim_fns.register_search_isaac_sim_extensions"
isaacsim_fns_get_isaac_sim_extension_details = "isaacsim_fns.register_get_isaac_sim_extension_details"
isaacsim_fns_search_isaac_sim_code_examples = "isaacsim_fns.register_search_isaac_sim_code_examples"
isaacsim_fns_search_isaac_sim_settings = "isaacsim_fns.register_search_isaac_sim_settings"

# NAT entry points (native)
[tool.poetry.plugins."nat.components"]
isaacsim_fns_get_isaac_sim_instructions = "isaacsim_fns.register_get_isaac_sim_instructions"
isaacsim_fns_search_isaac_sim_extensions = "isaacsim_fns.register_search_isaac_sim_extensions"
isaacsim_fns_get_isaac_sim_extension_details = "isaacsim_fns.register_get_isaac_sim_extension_details"
isaacsim_fns_search_isaac_sim_code_examples = "isaacsim_fns.register_search_isaac_sim_code_examples"
isaacsim_fns_search_isaac_sim_settings = "isaacsim_fns.register_search_isaac_sim_settings"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ["py311"]
include = '\.pyi?$'

[tool.flake8]
max-line-length = 120
ignore = ["E501", "W503"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=isaacsim_fns --cov-report=term-missing"
asyncio_mode = "auto"
