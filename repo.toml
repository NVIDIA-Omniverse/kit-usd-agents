########################################################################################################################
# Repo tool base settings
########################################################################################################################

[repo]

# Use the Kit Template repo configuration as a base. Only override things specific to the repo.
import_configs = ["${root}/_repo/deps/repo_kit_tools/kit-template/repo.toml"]

# Repository Name
name = "kit-usd-agents"

[repo_build]
# Bump typing_extensions/websockets in Kit's omni.kit.pip_archive to the versions
# langchain-core 1.4.x / langgraph_sdk need (ChatUSD agent stack). pip_archive loads
# first and shadows newer copies; idempotent + no-op once Kit ships them new enough.
# See tools/patch_kit_pip_archive.py. Uses the repo packman Python (bare python3 is
# not guaranteed on PATH in repo_build's subprocess env).
post_build.commands = [
    ["${root}/tools/packman/python${shell_ext}", "${root}/tools/patch_kit_pip_archive.py"],
]
licensing.enabled = false

[repo_test]
# Headless CI / datacenter GPUs (e.g. A40 on an older driver) can lag Kit's RTX
# driver allow-list. The app tests validate that agent extensions load, not RTX
# rendering, so don't fail on the renderer's driver-version warning. Real
# extension/import errors still fail.
stdout_fail_patterns.exclude = [
    "*rtx driver verification failed*",
    "*graphics driver is unsupported or has known issues*",
]
# The test job re-fetches a pristine Kit SDK via pull_kit_sdk (archive_post_unpack),
# which restores the unpatched omni.kit.pip_archive (typing_extensions 4.12.2 /
# websockets 12.0) -> langchain extension tests fail on extra_items / backoff. So
# re-apply the pip_archive alignment after the SDK pull, before the suites run.
archive_post_unpack_cmd = []
archive_post_unpack_cmds = [
    ["${test_root}/pull_kit_sdk${shell_ext}", "--registry=internal"],
    ["${root}/tools/packman/python${shell_ext}", "${root}/tools/patch_kit_pip_archive.py"],
]

[repo_test.suites.alltests]
kind = "glob_and_exec"
path = "${test_root}"
include = [
    "tests-*${shell_ext}",
]
exclude = [
    # Exclude full-app startup tests by default (matches kit-usd-agents, the sync
    # source). They launch the app with a full RTX renderer, which fails on CI
    # runners / datacenter GPUs that lack a new-enough driver (Kit 110 requires
    # R550+). The ChatUSD agent stack is covered by the omni.ai.chat_usd.bundle
    # and omni.ai.nat.agent.chat_usd extension tests, which run headless.
    "tests-omni.app.*${shell_ext}",
    # kit_inspector pulls deps not present in the public mirror.
    "tests-omni.ai.nat.mcp.kit_inspector*${shell_ext}",
]

[repo_build.docker]
enabled = false

[repo_build.fetch.pip]
licensing_enabled = false
# List of pip files to pip install from (in order)
files_to_pull = [
    "${root}/deps/pip-core.toml",
    "${root}/deps/pip-aiq.toml",
]

[repo_build.msbuild]
link_host_toolchain = true
vs_version = ""

[repo_docs]
name = "Kit Extension Template C++"
project = "kit-usd-agents"
api_output_directory = "api"
use_fast_doxygen_conversion=false
sphinx_version = "4.5.0.2-py3.10-${platform}"
sphinx_exclude_patterns = [
    "_build",
    "tools",
    "VERSION.md",
    "source/extensions/*/config/actions_api.md",
    "source/extensions/*/docs/Overview.md",
    "source/extensions/*/docs/CHANGELOG.md",
    "source/extensions/*/README.md",
]

[repo_docs.kit]
extensions = [
]

[repo_package.packages."platform:windows-x86_64".docs]
windows_max_path_length = 0

[repo_precache_exts]
registries = [
    { name = "kit/default", url = "https://ovextensionsprod.blob.core.windows.net/exts/kit/prod/${kit_version_major}/shared" },
    { name = "kit/sdk", url = "https://ovextensionsprod.blob.core.windows.net/exts/kit/prod/sdk/${kit_version_short}/${kit_git_hash}" },
]

[repo_symstore]
enabled = false
